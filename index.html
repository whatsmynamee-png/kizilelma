<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REALM CLASH - Kart Savaşı</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a227;
  --gold-light: #f0d060;
  --gold-dark: #8a6d10;
  --bg-deep: #0a0608;
  --bg-mid: #110d14;
  --bg-surface: #1a1220;
  --bg-card: #1e1628;
  --border: rgba(201,162,39,0.35);
  --border-bright: rgba(201,162,39,0.8);
  --text: #e8dcc8;
  --text-dim: #9a8870;
  --red: #d4263a;
  --blue: #2657d4;
  --green: #26a442;
  --purple: #8b26d4;
  --orange: #d47826;
  --cyan: #26c4d4;
  --shadow-glow: 0 0 20px rgba(201,162,39,0.3);

  /* Class colors */
  --wizard: #7b2fd4;
  --warrior: #d42b2b;
  --strategist: #2b6dd4;
  --guardian: #2bd47a;
  --chaos: #d42b9e;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg-deep);
  font-family: 'Cinzel', serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 80% 40% at 50% 0%, rgba(201,162,39,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 60% 60% at 20% 80%, rgba(139,38,212,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 60% 60% at 80% 80%, rgba(212,43,43,0.05) 0%, transparent 60%);
  pointer-events:none; z-index:0;
}

/* ─── HEADER ─── */
header {
  text-align:center; padding:18px 20px 12px;
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(10,6,8,0.95),rgba(10,6,8,0.7));
  position:relative; z-index:10;
}
header h1 {
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.4rem,3vw,2.2rem);
  background:linear-gradient(135deg,var(--gold-dark),var(--gold-light),var(--gold-dark));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  letter-spacing:.15em; text-shadow:none;
}
header .subtitle { font-size:.65rem; color:var(--text-dim); letter-spacing:.3em; margin-top:2px; }

/* ─── PHASE BAR ─── */
#phase-bar {
  display:flex; justify-content:center; gap:4px;
  padding:8px 16px; background:rgba(0,0,0,0.5);
  border-bottom:1px solid var(--border);
  position:relative; z-index:10;
  flex-wrap:wrap;
}
.phase-pill {
  padding:3px 12px; border-radius:20px;
  font-size:.55rem; letter-spacing:.15em;
  border:1px solid rgba(255,255,255,0.1);
  color:var(--text-dim); transition:all .3s;
}
.phase-pill.active {
  border-color:var(--gold); color:var(--gold);
  background:rgba(201,162,39,0.12);
  box-shadow:0 0 8px rgba(201,162,39,0.3);
}

/* ─── MAIN LAYOUT ─── */
#game {
  display:grid;
  grid-template-rows:auto 1fr auto auto auto;
  gap:0;
  max-width:1200px; margin:0 auto;
  padding:12px;
  position:relative; z-index:1;
  min-height:calc(100vh - 120px);
}

/* ─── PLAYER INFO BARS ─── */
.player-info {
  display:flex; align-items:center; gap:12px;
  padding:8px 16px; border-radius:8px;
  background:rgba(0,0,0,0.4);
  border:1px solid var(--border);
  margin-bottom:8px;
}
.player-info.enemy { border-color:rgba(212,38,58,0.3); margin-bottom:0; margin-top:8px; }

.player-name { font-size:.75rem; letter-spacing:.1em; min-width:100px; }
.hp-bar-wrap { flex:1; }
.hp-label { font-size:.55rem; color:var(--text-dim); letter-spacing:.1em; margin-bottom:3px; }
.hp-bar {
  height:14px; border-radius:7px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1);
  overflow:hidden; position:relative;
}
.hp-fill {
  height:100%; border-radius:7px;
  background:linear-gradient(90deg,#1a7a2a,#2bd47a);
  transition:width .6s ease;
  position:relative;
}
.hp-fill::after {
  content:''; position:absolute; top:1px; left:4px; right:4px; height:4px;
  background:rgba(255,255,255,0.25); border-radius:3px;
}
.hp-fill.low { background:linear-gradient(90deg,#7a1a1a,#d42b2b); }
.hp-fill.mid { background:linear-gradient(90deg,#7a5a1a,#d4a226); }
.hp-text { font-size:.7rem; color:var(--gold); min-width:60px; text-align:right; }

.mana-display {
  display:flex; gap:3px; align-items:center;
}
.mana-orb {
  width:10px; height:10px; border-radius:50%;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.2);
  transition:all .3s;
}
.mana-orb.filled {
  background:radial-gradient(circle at 35% 35%, #7af, #26c4d4);
  border-color:#26c4d4;
  box-shadow:0 0 4px rgba(38,196,212,0.5);
}
.mana-label { font-size:.55rem; color:var(--text-dim); letter-spacing:.1em; margin-right:2px; }

/* ─── BATTLEFIELD ─── */
#battlefield {
  display:grid;
  grid-template-rows:1fr 40px 1fr;
  gap:6px;
  background:radial-gradient(ellipse 100% 100% at 50% 50%, rgba(201,162,39,0.04) 0%, transparent 70%);
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  position:relative;
  overflow:hidden;
}
#battlefield::before {
  content:'';
  position:absolute; inset:0;
  background:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:60px 60px;
  opacity:0.15; pointer-events:none;
}

.field-zone {
  display:flex; gap:8px;
  justify-content:center; align-items:center;
  min-height:90px;
}
.field-zone.enemy-zone { align-items:flex-start; }
.field-zone.player-zone { align-items:flex-end; }

#center-divider {
  display:flex; align-items:center; gap:12px;
  justify-content:center;
}
.divider-line {
  flex:1; height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
}
.divider-icon {
  font-size:1.2rem; color:var(--gold-dark);
  text-shadow:0 0 10px var(--gold);
}

/* ─── FIELD CARD SLOT ─── */
.field-slot {
  width:72px; height:100px;
  border:1px dashed rgba(201,162,39,0.2);
  border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:.5rem; color:var(--text-dim);
  letter-spacing:.1em;
  transition:all .3s;
  position:relative;
  background:rgba(0,0,0,0.2);
}
.field-slot.occupied { border:none; background:none; cursor:pointer; }
.field-slot.occupied:hover { transform:translateY(-4px); }
.field-slot.selected-attack { 
  box-shadow:0 0 20px rgba(212,38,58,0.6);
  border:2px solid var(--red);
}

/* ─── CARD ─── */
.card {
  width:72px; height:100px;
  border-radius:6px;
  border:1.5px solid;
  display:flex; flex-direction:column;
  position:relative; overflow:hidden;
  cursor:pointer;
  transition:transform .2s, box-shadow .2s;
  background:var(--bg-card);
  user-select:none;
}
.card:hover { transform:translateY(-6px) scale(1.05); }
.card.in-hand { width:76px; height:106px; }
.card.in-hand:hover { transform:translateY(-16px) scale(1.08); z-index:50; }
.card.selected { transform:translateY(-20px) scale(1.1) !important; z-index:60; }
.card.attacking { animation:attack-pulse .4s ease-in-out; }

@keyframes attack-pulse {
  0%,100%{transform:translateY(-6px) scale(1.05);}
  50%{transform:translateY(-6px) scale(1.18) rotate(3deg);}
}

.card-header {
  padding:3px 4px 2px;
  font-size:.45rem; letter-spacing:.08em;
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex; justify-content:space-between;
  align-items:center;
}
.card-name {
  font-size:.42rem; font-weight:700;
  line-height:1.1; flex:1;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.card-cost {
  font-size:.5rem; font-weight:700;
  width:14px; height:14px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:rgba(38,196,212,0.2); border:1px solid rgba(38,196,212,0.5);
  color:#26c4d4; flex-shrink:0;
  font-family:'Crimson Text',serif;
}

.card-art {
  flex:1; display:flex; align-items:center; justify-content:center;
  font-size:1.8rem; position:relative; overflow:hidden;
}
.card-art::before {
  content:''; position:absolute; inset:0;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,0.08), transparent 70%);
}

.card-footer {
  padding:3px 4px;
  display:flex; justify-content:space-between;
  font-size:.45rem;
  border-top:1px solid rgba(255,255,255,0.08);
}
.card-atk { color:#ff6b6b; font-weight:700; }
.card-def { color:#6bbbff; font-weight:700; }
.card-type-badge {
  position:absolute; top:2px; right:2px;
  font-size:.38rem; padding:1px 3px; border-radius:3px;
  font-weight:700; letter-spacing:.05em;
}

/* Class-specific card borders and colors */
.card.wizard { border-color:var(--wizard); }
.card.wizard .card-header { background:rgba(123,47,212,0.25); }
.card.wizard .card-art { background:linear-gradient(180deg,rgba(123,47,212,0.2),rgba(10,6,8,0.8)); }
.card.wizard .card-type-badge { background:rgba(123,47,212,0.6); }

.card.warrior { border-color:var(--warrior); }
.card.warrior .card-header { background:rgba(212,43,43,0.25); }
.card.warrior .card-art { background:linear-gradient(180deg,rgba(212,43,43,0.2),rgba(10,6,8,0.8)); }
.card.warrior .card-type-badge { background:rgba(212,43,43,0.6); }

.card.strategist { border-color:var(--strategist); }
.card.strategist .card-header { background:rgba(43,109,212,0.25); }
.card.strategist .card-art { background:linear-gradient(180deg,rgba(43,109,212,0.2),rgba(10,6,8,0.8)); }
.card.strategist .card-type-badge { background:rgba(43,109,212,0.6); }

.card.guardian { border-color:var(--guardian); }
.card.guardian .card-header { background:rgba(43,212,122,0.2); }
.card.guardian .card-art { background:linear-gradient(180deg,rgba(43,212,122,0.15),rgba(10,6,8,0.8)); }
.card.guardian .card-type-badge { background:rgba(43,212,122,0.4); color:#000; }

.card.chaos { border-color:var(--chaos); }
.card.chaos .card-header { background:rgba(212,43,158,0.25); }
.card.chaos .card-art { background:linear-gradient(180deg,rgba(212,43,158,0.2),rgba(10,6,8,0.8)); }
.card.chaos .card-type-badge { background:rgba(212,43,158,0.6); }

/* face-down card */
.card.face-down .card-header,
.card.face-down .card-footer,
.card.face-down .card-art { opacity:0; }
.card.face-down {
  background:repeating-linear-gradient(
    45deg,
    rgba(201,162,39,0.08) 0px, rgba(201,162,39,0.08) 2px,
    transparent 2px, transparent 10px
  );
  border-color:var(--gold-dark);
}
.card.face-down::after {
  content:'⚜'; position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-size:1.8rem; color:var(--gold-dark);
  opacity:0.5;
}

/* ─── HAND AREA ─── */
#hand-area {
  padding:8px 12px;
  background:rgba(0,0,0,0.4);
  border-top:1px solid var(--border);
  border-radius:0 0 8px 8px;
}
#hand-area h3 {
  font-size:.55rem; letter-spacing:.2em; color:var(--text-dim);
  margin-bottom:6px;
}
#hand-cards {
  display:flex; gap:6px; overflow-x:auto;
  padding-bottom:4px; justify-content:center;
  flex-wrap:wrap;
}
#hand-cards::-webkit-scrollbar { height:4px; }
#hand-cards::-webkit-scrollbar-track { background:rgba(0,0,0,0.3); }
#hand-cards::-webkit-scrollbar-thumb { background:var(--gold-dark); border-radius:2px; }

/* ─── CONTROLS ─── */
#controls {
  display:flex; gap:8px; justify-content:center;
  flex-wrap:wrap; padding:10px 12px;
  background:rgba(0,0,0,0.3);
  border-top:1px solid var(--border);
}
.btn {
  padding:7px 18px; border-radius:4px;
  font-family:'Cinzel',serif; font-size:.6rem; letter-spacing:.15em;
  border:1px solid; cursor:pointer;
  transition:all .25s; position:relative; overflow:hidden;
  background:transparent; text-transform:uppercase;
}
.btn::before {
  content:''; position:absolute; inset:0;
  background:currentColor; opacity:0; transition:opacity .2s;
}
.btn:hover::before { opacity:0.08; }
.btn:active { transform:scale(0.97); }

.btn-gold { border-color:var(--gold); color:var(--gold); }
.btn-gold:hover { box-shadow:0 0 12px rgba(201,162,39,0.4); }
.btn-red { border-color:var(--red); color:var(--red); }
.btn-red:hover { box-shadow:0 0 12px rgba(212,38,58,0.4); }
.btn-blue { border-color:var(--blue); color:var(--blue); }
.btn-blue:hover { box-shadow:0 0 12px rgba(38,87,212,0.4); }
.btn-green { border-color:var(--green); color:var(--green); }
.btn-green:hover { box-shadow:0 0 12px rgba(38,164,66,0.4); }
.btn:disabled { opacity:.35; cursor:not-allowed; }
.btn:disabled:hover { box-shadow:none; }

/* ─── LOG ─── */
#log-area {
  margin-top:6px; padding:8px 12px;
  background:rgba(0,0,0,0.5);
  border:1px solid var(--border);
  border-radius:8px; max-height:100px; overflow-y:auto;
}
#log-area h3 { font-size:.5rem; letter-spacing:.2em; color:var(--text-dim); margin-bottom:4px; }
.log-entry {
  font-family:'Crimson Text',serif;
  font-size:.75rem; color:var(--text-dim);
  padding:1px 0; border-bottom:1px solid rgba(255,255,255,0.03);
  line-height:1.3;
}
.log-entry.important { color:var(--gold); }
.log-entry.damage { color:#ff8888; }
.log-entry.combo { color:#c088ff; }
.log-entry.heal { color:#88ff88; }

/* ─── CARD DETAIL PANEL ─── */
#detail-panel {
  position:fixed; right:12px; top:50%; transform:translateY(-50%);
  width:160px; background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:10px; padding:12px;
  z-index:100; display:none;
  box-shadow:0 0 30px rgba(0,0,0,0.7);
}
#detail-panel.show { display:block; animation:panel-in .2s ease; }
@keyframes panel-in {
  from{opacity:0;transform:translateY(-50%) translateX(10px);}
  to{opacity:1;transform:translateY(-50%) translateX(0);}
}
#detail-panel .d-art { font-size:3rem; text-align:center; margin-bottom:8px; }
#detail-panel .d-name { font-size:.75rem; font-weight:700; letter-spacing:.1em; text-align:center; margin-bottom:4px; }
#detail-panel .d-class { font-size:.55rem; letter-spacing:.15em; text-align:center; color:var(--text-dim); margin-bottom:8px; }
#detail-panel .d-stats { display:flex; justify-content:space-around; margin-bottom:8px; }
#detail-panel .d-stat { text-align:center; }
#detail-panel .d-stat-val { font-size:.9rem; font-weight:700; }
#detail-panel .d-stat-lab { font-size:.45rem; letter-spacing:.1em; color:var(--text-dim); }
#detail-panel .d-effect {
  font-family:'Crimson Text',serif; font-size:.7rem; color:var(--text-dim);
  line-height:1.4; border-top:1px solid var(--border); padding-top:8px;
}
#detail-panel .d-combo {
  margin-top:6px; padding:4px 6px;
  background:rgba(192,136,255,0.1); border-radius:4px;
  border:1px solid rgba(192,136,255,0.2);
  font-size:.6rem; color:#c088ff;
}

/* ─── FLOATING DAMAGE ─── */
.float-dmg {
  position:fixed; font-family:'Cinzel Decorative',serif;
  font-size:1.5rem; font-weight:900; pointer-events:none;
  z-index:999; text-shadow:0 0 20px currentColor;
  animation:float-up 1.2s ease-out forwards;
}
@keyframes float-up {
  0%{opacity:1;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-80px) scale(1.5);}
}

/* ─── COMBO BANNER ─── */
#combo-banner {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:200; text-align:center; pointer-events:none;
  display:none;
}
#combo-banner.show { display:block; animation:combo-appear 2s ease-out forwards; }
@keyframes combo-appear {
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.5);}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
  30%{transform:translate(-50%,-50%) scale(1);}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(0.8);}
}
#combo-banner .combo-title {
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(1.5rem,4vw,2.5rem);
  background:linear-gradient(135deg,#c088ff,#ff88cc,#ffd700);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  letter-spacing:.2em;
  text-shadow:none;
  filter:drop-shadow(0 0 20px rgba(192,136,255,0.8));
}
#combo-banner .combo-sub { font-size:.8rem; color:var(--gold-light); letter-spacing:.3em; }

/* ─── WIN/LOSE SCREEN ─── */
#end-screen {
  position:fixed; inset:0; z-index:300;
  background:rgba(0,0,0,0.85);
  display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:16px;
}
#end-screen.show { display:flex; }
#end-screen .end-title {
  font-family:'Cinzel Decorative',serif;
  font-size:clamp(2rem,6vw,4rem);
  letter-spacing:.2em;
}
#end-screen .end-title.win {
  background:linear-gradient(135deg,var(--gold-dark),var(--gold-light),var(--gold-dark));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
#end-screen .end-title.lose { color:var(--red); }

/* ─── TOOLTIP ─── */
.tooltip {
  position:absolute; bottom:110%; left:50%; transform:translateX(-50%);
  white-space:nowrap; background:var(--bg-mid);
  border:1px solid var(--border); border-radius:4px;
  padding:3px 8px; font-size:.5rem; letter-spacing:.1em;
  pointer-events:none; opacity:0; transition:opacity .2s;
  z-index:200;
}
.has-tooltip:hover .tooltip { opacity:1; }

/* scrollbar */
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:rgba(0,0,0,0.2); }
::-webkit-scrollbar-thumb { background:var(--gold-dark); border-radius:2px; }

@media(max-width:600px){
  #detail-panel { display:none !important; }
  .card.in-hand { width:62px; height:88px; }
}
</style>
</head>
<body>

<header>
  <h1>⚔ REALM CLASH ⚔</h1>
  <div class="subtitle">KARTLAR SAVAŞIR — KADER BELİRLENİR</div>
</header>

<div id="phase-bar">
  <div class="phase-pill" id="ph-draw">ÇEK</div>
  <div class="phase-pill active" id="ph-main">ANA FAZ</div>
  <div class="phase-pill" id="ph-battle">SAVAŞ</div>
  <div class="phase-pill" id="ph-end">BİTİŞ</div>
</div>

<div id="game">
  <!-- Enemy info -->
  <div class="player-info enemy">
    <div class="player-name" style="color:#ff8888">⚔ DÜŞMAN</div>
    <div class="hp-bar-wrap">
      <div class="hp-label">CAN PUANI</div>
      <div class="hp-bar"><div class="hp-fill" id="enemy-hp-fill" style="width:100%"></div></div>
    </div>
    <div class="hp-text" id="enemy-hp-text">4000 / 4000</div>
    <div class="mana-display">
      <div class="mana-label">MANA</div>
      <div id="enemy-mana-orbs"></div>
    </div>
  </div>

  <!-- Battlefield -->
  <div id="battlefield">
    <div class="field-zone enemy-zone" id="enemy-field"></div>
    <div id="center-divider">
      <div class="divider-line"></div>
      <div class="divider-icon">⚜</div>
      <div class="divider-line"></div>
    </div>
    <div class="field-zone player-zone" id="player-field"></div>
  </div>

  <!-- Player info -->
  <div class="player-info">
    <div class="player-name" style="color:#88ffaa">🛡 SEN</div>
    <div class="hp-bar-wrap">
      <div class="hp-label">CAN PUANI</div>
      <div class="hp-bar"><div class="hp-fill" id="player-hp-fill" style="width:100%"></div></div>
    </div>
    <div class="hp-text" id="player-hp-text">4000 / 4000</div>
    <div class="mana-display">
      <div class="mana-label">MANA</div>
      <div id="player-mana-orbs"></div>
    </div>
  </div>

  <!-- Hand -->
  <div id="hand-area">
    <h3>ELİNDEKİ KARTLAR</h3>
    <div id="hand-cards"></div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <button class="btn btn-gold has-tooltip" id="btn-draw" onclick="drawCard()">
      KART ÇEK
      <span class="tooltip">Destenden 1 kart çek</span>
    </button>
    <button class="btn btn-red has-tooltip" id="btn-attack" onclick="startAttackMode()" disabled>
      SALDIRI
      <span class="tooltip">Sahada kart seç → düşman kartına saldır</span>
    </button>
    <button class="btn btn-blue has-tooltip" onclick="checkCombos()">
      KOMBİNASYON
      <span class="tooltip">Mevcut komboları kontrol et</span>
    </button>
    <button class="btn btn-green" onclick="endTurn()">TUR BİTİR</button>
  </div>

  <!-- Log -->
  <div id="log-area">
    <h3>SAVAŞ GÜNLÜĞÜ</h3>
    <div id="log-list"></div>
  </div>
</div>

<!-- Card Detail Panel -->
<div id="detail-panel">
  <div class="d-art" id="d-art">⚡</div>
  <div class="d-name" id="d-name">Kart Adı</div>
  <div class="d-class" id="d-class">SINIF</div>
  <div class="d-stats">
    <div class="d-stat">
      <div class="d-stat-val" id="d-atk" style="color:#ff6b6b">0</div>
      <div class="d-stat-lab">SALDIRI</div>
    </div>
    <div class="d-stat">
      <div class="d-stat-val" id="d-def" style="color:#6bbbff">0</div>
      <div class="d-stat-lab">SAVUNMA</div>
    </div>
    <div class="d-stat">
      <div class="d-stat-val" id="d-cost" style="color:#26c4d4">0</div>
      <div class="d-stat-lab">MANA</div>
    </div>
  </div>
  <div class="d-effect" id="d-effect">Kart efekti buraya gelir.</div>
  <div class="d-combo" id="d-combo" style="display:none">⚡ KOMBİNASYON</div>
</div>

<!-- Combo Banner -->
<div id="combo-banner">
  <div class="combo-title" id="combo-title">KOMBİNASYON!</div>
  <div class="combo-sub" id="combo-sub">+500 HASAR</div>
</div>

<!-- End Screen -->
<div id="end-screen">
  <div class="end-title" id="end-title">KAZANDIN!</div>
  <button class="btn btn-gold" onclick="resetGame()" style="font-size:.8rem; padding:12px 32px;">YENİDEN OYNA</button>
</div>

<script src="cards.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════
let gs = {};
let attackMode = false;
let selectedFieldIndex = -1;
let triggeredCombos = new Set();

function initGame(){
  gs = {
    playerHP: 4000, playerMaxHP: 4000,
    enemyHP: 4000, enemyMaxHP: 4000,
    playerMana: 5, playerMaxMana: 5,
    enemyMana: 5, enemyMaxMana: 5,
    playerHand: [],
    enemyHand: [],
    playerField: [null,null,null,null,null],
    enemyField: [null,null,null,null,null],
    playerDeck: [],
    enemyDeck: [],
    turn: 1,
    phase: 'main',
    gameOver: false,
  };
  triggeredCombos.clear();
  attackMode = false;
  selectedFieldIndex = -1;
  buildDecks();
  for(let i=0;i<4;i++) drawCard();
  for(let i=0;i<3;i++) enemyDrawCard();
  enemySummonRandom();
  updateAll();
  addLog('⚜ Savaş başladı! İlk hamle sende.','important');
}

function buildDecks(){
  const all = [...CARD_DB];
  const shuffled = all.sort(()=>Math.random()-.5);
  gs.playerDeck = shuffled.map(c=>({...c}));
  gs.enemyDeck = [...CARD_DB].sort(()=>Math.random()-.5).map(c=>({...c}));
}

// ═══════════════════════════════════════════════════════════
//  DRAW
// ═══════════════════════════════════════════════════════════
function drawCard(){
  if(gs.gameOver) return;
  if(gs.playerDeck.length===0){
    addLog('Desten bitti! Can kaybettin.','damage');
    gs.playerHP -= 300; updateAll(); checkEnd(); return;
  }
  if(gs.playerHand.length>=8){ addLog('El dolu! Max 8 kart.'); return; }
  const c = gs.playerDeck.pop();
  gs.playerHand.push(c);
  updateAll();
  addLog(`📥 "${c.name}" çekildi.`);
}
function enemyDrawCard(){
  if(gs.enemyDeck.length===0) return;
  if(gs.enemyHand.length>=8) return;
  gs.enemyHand.push(gs.enemyDeck.pop());
}

// ═══════════════════════════════════════════════════════════
//  SUMMON
// ═══════════════════════════════════════════════════════════
function summonCard(handIndex){
  if(gs.gameOver||gs.phase!=='main') return;
  const card = gs.playerHand[handIndex];
  if(!card) return;
  if(gs.playerMana < card.cost){ addLog(`⛔ Yeterli mana yok! (${card.cost} gerekli, ${gs.playerMana} var)`,'damage'); return; }
  const slot = gs.playerField.indexOf(null);
  if(slot===-1){ addLog('⛔ Alan dolu! Max 5 kart sahada olabilir.'); return; }
  gs.playerMana -= card.cost;
  gs.playerHand.splice(handIndex,1);
  gs.playerField[slot] = {...card};
  if(card.onSummon) card.onSummon(gs);
  addLog(`⬆️ "${card.name}" sahaya çıkarıldı! (${card.atk} ATK / ${card.def} DEF)`,'important');
  checkCombosAuto();
  updateAll();
}

function enemySummonRandom(){
  const affordable = gs.enemyHand.filter(c=> c.cost <= gs.enemyMana);
  if(affordable.length===0) return;
  const slots = gs.enemyField.reduce((a,v,i)=>{if(!v)a.push(i);return a;},[]);
  if(slots.length===0) return;
  const card = affordable[Math.floor(Math.random()*affordable.length)];
  const idx = gs.enemyHand.indexOf(card);
  gs.enemyMana -= card.cost;
  gs.enemyHand.splice(idx,1);
  gs.enemyField[slots[0]] = {...card};
  addLog(`👹 Düşman "${card.name}" sahaya çıkardı!`);
}

// ═══════════════════════════════════════════════════════════
//  ATTACK SYSTEM
// ═══════════════════════════════════════════════════════════
function startAttackMode(){
  if(gs.gameOver||gs.phase!=='battle'){ addLog('⛔ Savaş fazına geçmeden saldıramazsın!'); return; }
  attackMode = true;
  selectedFieldIndex = -1;
  addLog('⚔ Saldırı modu: sahandan bir kart seç.');
  updateAll();
}

function selectFieldCard(index, isEnemy){
  if(gs.gameOver) return;
  const card = isEnemy ? gs.enemyField[index] : gs.playerField[index];
  if(!card) return;
  showDetail(card);
  if(attackMode && !isEnemy){
    selectedFieldIndex = index;
    addLog(`🎯 "${card.name}" saldırı için seçildi. Şimdi hedef seç.`);
    updateAll(); return;
  }
  if(attackMode && isEnemy && selectedFieldIndex!==-1){
    executeAttack(selectedFieldIndex, index);
    attackMode = false; selectedFieldIndex = -1;
    updateAll(); return;
  }
  if(attackMode && isEnemy && selectedFieldIndex===-1){
    executeDirect(index); return;
  }
}

function executeAttack(atkIdx, defIdx){
  const attacker = gs.playerField[atkIdx];
  const defender = gs.enemyField[defIdx];
  if(!attacker||!defender) return;
  if(defender.frozen){ 
    addLog(`🧊 "${defender.name}" donmuş! Savunma yapamıyor.`,'important');
    gs.enemyField[defIdx] = null;
    updateAll(); checkEnd(); return;
  }
  let atkPow = attacker.atk + (attacker.attackBonus||0) + (attacker.firstStrike||0);
  let defPow = attacker.ignoreDefense ? 0 : defender.def;
  attacker.firstStrike = 0;
  const diff = atkPow - defPow;
  addLog(`⚔️ "${attacker.name}" (${atkPow}) → "${defender.name}" (DEF:${defPow})`);
  if(diff > 0){
    gs.enemyHP -= diff;
    if(attacker.onKill) attacker.onKill(gs);
    gs.enemyField[defIdx] = null;
    addLog(`💥 "${defender.name}" yok edildi! Düşmana ${diff} hasar!`,'damage');
    showFloatDmg(diff,'#ff4444');
  } else if(diff < 0){
    gs.playerHP += diff; // diff negatif
    if(attacker.onHit) attacker.onHit(gs, Math.abs(diff));
    gs.playerField[atkIdx] = null;
    addLog(`🛡 "${attacker.name}" yenildi! Sana ${Math.abs(diff)} hasar.`,'damage');
    showFloatDmg(Math.abs(diff),'#ff8844', true);
  } else {
    gs.playerField[atkIdx] = null;
    gs.enemyField[defIdx] = null;
    addLog('⚡ Eşit güç! Her iki kart da yok oldu.');
  }
  updateAll(); checkEnd();
}

function executeDirect(enemyIdx){
  // Direct attack on player if no enemies blocking
  const attacker = gs.playerField[selectedFieldIndex];
  if(!attacker) return;
  const enemySlots = gs.enemyField.filter(Boolean);
  if(enemySlots.length>0){ addLog('⛔ Düşman kartlarını geçmeden direkt saldıramazsın!'); return; }
  let dmg = attacker.atk + (attacker.attackBonus||0);
  gs.enemyHP -= dmg;
  addLog(`💀 Direkt saldırı! Düşmana ${dmg} hasar!`,'damage');
  showFloatDmg(dmg,'#ff4444');
  attackMode=false; selectedFieldIndex=-1;
  updateAll(); checkEnd();
}

// ═══════════════════════════════════════════════════════════
//  EFFECTS
// ═══════════════════════════════════════════════════════════
function dealDirectDamage(gs,amount,type){
  gs.enemyHP -= amount;
  addLog(`💢 ${type} hasarı: ${amount}!`,'damage');
  showFloatDmg(amount,'#ff4444');
}
function healPlayer(gs,amount){
  gs.playerHP = Math.min(gs.playerMaxHP, gs.playerHP + amount);
  addLog(`💚 ${amount} can yenilendi!`,'heal');
  showFloatDmg(amount,'#44ff88',true);
}
function freezeStrongestEnemy(gs){
  const strongest = gs.enemyField.reduce((b,c,i)=>{ if(c&&(!b||c.atk>gs.enemyField[b].atk)) return i; return b; }, null);
  if(strongest!==null&&gs.enemyField[strongest]){
    gs.enemyField[strongest].frozen = true;
    addLog(`🧊 "${gs.enemyField[strongest].name}" donduruldu!`,'important');
  }
}
function discardEnemyCard(gs){
  const idx = gs.enemyHand.findIndex(()=>true);
  if(idx!==-1){ const c=gs.enemyHand.splice(idx,1)[0]; addLog(`🗑️ Düşmanın "${c.name}" kartı silindi!`,'important'); }
}
function buffAllies(gs,atkBuff,defBuff){
  gs.playerField.forEach(c=>{ if(c){ c.atk+=atkBuff; c.def+=defBuff; } });
  addLog(`⬆️ Tüm müttefiklere +${atkBuff} ATK +${defBuff} DEF!`,'important');
}
function peekEnemyHand(gs){
  const names = gs.enemyHand.map(c=>c.name).join(', ')||'(boş)';
  addLog(`👁️ Düşmanın eli: ${names}`,'important');
}

// ═══════════════════════════════════════════════════════════
//  COMBOS
// ═══════════════════════════════════════════════════════════
function checkCombosAuto(){
  COMBOS.forEach(combo=>{
    if(!triggeredCombos.has(combo.name) && combo.check(gs.playerField)){
      triggeredCombos.add(combo.name);
      combo.apply(gs);
    }
  });
  updateAll();
}
function checkCombos(){
  let found = false;
  COMBOS.forEach(combo=>{
    if(combo.check(gs.playerField)){
      addLog(`✅ Kombo aktif: ${combo.name} — ${combo.desc}`,'combo');
      found = true;
    }
  });
  if(!found) addLog('❌ Şu an aktif kombo yok.');
}

// ═══════════════════════════════════════════════════════════
//  TURN MANAGEMENT
// ═══════════════════════════════════════════════════════════
function endTurn(){
  if(gs.gameOver) return;
  // End of turn effects
  gs.playerField.forEach(c=>{
    if(c&&c.endOfTurn) c.endOfTurn(gs,c);
  });
  // Enemy turn
  addLog('──── DÜŞMAN TURU ────','important');
  enemyTurn();
  gs.turn++;
  gs.playerMana = gs.playerMaxMana + (gs.playerField.reduce((s,c)=>s+(c&&c.passiveMana||0),0));
  gs.enemyMana = gs.enemyMaxMana;
  setPhase('main');
  triggeredCombos.clear();
  drawCard();
  updateAll();
  addLog(`⚜ Tur ${gs.turn} başladı.`,'important');
}

function enemyTurn(){
  // Enemy end of turn effects
  gs.enemyField.forEach(c=>{
    if(c&&c.endOfTurn) c.endOfTurn(gs,c);
  });
  // Enemy draw
  enemyDrawCard();
  // Enemy summon
  if(Math.random()>.3) enemySummonRandom();
  // Enemy attack
  const atkCards = gs.enemyField.filter(Boolean);
  if(atkCards.length>0){
    const attacker = atkCards[Math.floor(Math.random()*atkCards.length)];
    const playerCards = gs.playerField.filter(Boolean);
    if(playerCards.length>0){
      const target = playerCards[Math.floor(Math.random()*playerCards.length)];
      const defIdx = gs.playerField.indexOf(target);
      let atkPow = attacker.atk + (attacker.attackBonus||0);
      let defPow = target.def;
      const diff = atkPow - defPow;
      addLog(`👹 "${attacker.name}" (${atkPow}) → "${target.name}" (DEF:${defPow})`);
      if(diff>0){ 
        gs.playerHP -= diff; 
        gs.playerField[defIdx]=null; 
        addLog(`😱 "${target.name}" yenildi! Sana ${diff} hasar.`,'damage');
        showFloatDmg(diff,'#ff4444',true);
      } else if(diff<0){
        gs.enemyHP += diff;
        const ei = gs.enemyField.indexOf(attacker);
        gs.enemyField[ei]=null;
        addLog(`😤 "${attacker.name}" yenildi! Düşmana ${Math.abs(diff)} refleks hasar!`);
      } else {
        const ei = gs.enemyField.indexOf(attacker);
        gs.enemyField[ei]=null; gs.playerField[defIdx]=null;
        addLog('💨 Eşit güç: iki kart da yok oldu!');
      }
    } else {
      // Direct attack
      gs.playerHP -= attacker.atk;
      addLog(`💀 Düşman direkt saldırdı! Sana ${attacker.atk} hasar.`,'damage');
      showFloatDmg(attacker.atk,'#ff4444',true);
    }
  }
  checkEnd();
  updateAll();
}

function setPhase(p){
  gs.phase = p;
  document.querySelectorAll('.phase-pill').forEach(el=>el.classList.remove('active'));
  const map={draw:'ph-draw',main:'ph-main',battle:'ph-battle',end:'ph-end'};
  if(map[p]) document.getElementById(map[p]).classList.add('active');
  document.getElementById('btn-attack').disabled = p!=='battle';
}
function goToBattle(){
  setPhase('battle');
  addLog('⚔ Savaş fazına girildi! Saldırmak için kart seç.');
}

// ═══════════════════════════════════════════════════════════
//  END CHECK
// ═══════════════════════════════════════════════════════════
function checkEnd(){
  if(gs.gameOver) return;
  if(gs.playerHP<=0){
    gs.playerHP=0; gs.gameOver=true;
    document.getElementById('end-title').textContent='MAĞLUP OLDUN!';
    document.getElementById('end-title').className='end-title lose';
    document.getElementById('end-screen').classList.add('show');
  } else if(gs.enemyHP<=0){
    gs.enemyHP=0; gs.gameOver=true;
    document.getElementById('end-title').textContent='ZAFERİN!';
    document.getElementById('end-title').className='end-title win';
    document.getElementById('end-screen').classList.add('show');
  }
  updateAll();
}

function resetGame(){
  document.getElementById('end-screen').classList.remove('show');
  document.getElementById('log-list').innerHTML='';
  initGame();
}

// ═══════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════
function updateAll(){
  renderHP();
  renderMana();
  renderField();
  renderHand();
}

function renderHP(){
  const pp = Math.max(0,gs.playerHP/gs.playerMaxHP*100);
  const ep = Math.max(0,gs.enemyHP/gs.enemyMaxHP*100);
  const pf = document.getElementById('player-hp-fill');
  const ef = document.getElementById('enemy-hp-fill');
  pf.style.width=pp+'%';
  ef.style.width=ep+'%';
  pf.className='hp-fill'+(pp<25?' low':pp<50?' mid':'');
  ef.className='hp-fill'+(ep<25?' low':ep<50?' mid':'');
  document.getElementById('player-hp-text').textContent=`${Math.max(0,gs.playerHP)} / ${gs.playerMaxHP}`;
  document.getElementById('enemy-hp-text').textContent=`${Math.max(0,gs.enemyHP)} / ${gs.enemyMaxHP}`;
}

function renderMana(){
  const pm = document.getElementById('player-mana-orbs');
  const em = document.getElementById('enemy-mana-orbs');
  pm.innerHTML=''; em.innerHTML='';
  for(let i=0;i<gs.playerMaxMana;i++){
    const o=document.createElement('div');
    o.className='mana-orb'+(i<gs.playerMana?' filled':'');
    pm.appendChild(o);
  }
  for(let i=0;i<gs.enemyMaxMana;i++){
    const o=document.createElement('div');
    o.className='mana-orb'+(i<gs.enemyMana?' filled':'');
    em.appendChild(o);
  }
}

function renderField(){
  const pf = document.getElementById('player-field');
  const ef = document.getElementById('enemy-field');
  pf.innerHTML=''; ef.innerHTML='';
  for(let i=0;i<5;i++){
    const pc = gs.playerField[i];
    const slot = document.createElement('div');
    if(pc){
      slot.className='field-slot occupied';
      if(i===selectedFieldIndex&&attackMode) slot.classList.add('selected-attack');
      slot.innerHTML=buildCardHTML(pc,false,true);
      slot.onclick=(()=>{const idx=i; return ()=>selectFieldCard(idx,false);})();
    } else {
      slot.className='field-slot';
      slot.textContent='BOŞLUK';
    }
    pf.appendChild(slot);
  }
  for(let i=0;i<5;i++){
    const ec = gs.enemyField[i];
    const slot = document.createElement('div');
    if(ec){
      slot.className='field-slot occupied';
      slot.innerHTML=buildCardHTML(ec,false,true);
      slot.onclick=(()=>{const idx=i; return ()=>selectFieldCard(idx,true);})();
    } else {
      slot.className='field-slot';
      slot.textContent='BOŞLUK';
    }
    ef.appendChild(slot);
  }
}

function renderHand(){
  const hc = document.getElementById('hand-cards');
  hc.innerHTML='';
  gs.playerHand.forEach((card,i)=>{
    const div = document.createElement('div');
    div.innerHTML=buildCardHTML(card,true,false);
    const cardEl = div.firstChild;
    cardEl.onclick=(()=>{const idx=i; return ()=>{ showDetail(card); summonCard(idx); }})();
    hc.appendChild(cardEl);
  });
}

function buildCardHTML(card, inHand=false, field=false){
  const classColors = {
    wizard:'var(--wizard)',warrior:'var(--warrior)',
    strategist:'var(--strategist)',guardian:'var(--guardian)',chaos:'var(--chaos)'
  };
  const classNames = {
    wizard:'BÜYÜCÜ',warrior:'SAVAŞÇI',
    strategist:'STRATEJİST',guardian:'GARDİYAN',chaos:'KAOS'
  };
  const sz = inHand ? 'in-hand' : '';
  const frozen = card.frozen ? ' style="filter:hue-rotate(180deg) saturate(0.5)"' : '';
  return `<div class="card ${card.class} ${sz}" ${frozen}>
    <div class="card-type-badge">${classNames[card.class]||card.class}</div>
    <div class="card-header">
      <div class="card-name">${card.name}</div>
      <div class="card-cost">${card.cost}</div>
    </div>
    <div class="card-art">${card.emoji}</div>
    <div class="card-footer">
      <span class="card-atk">⚔${card.atk}</span>
      <span class="card-def">🛡${card.def}</span>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════
//  DETAIL PANEL
// ═══════════════════════════════════════════════════════════
function showDetail(card){
  if(!card) return;
  const panel = document.getElementById('detail-panel');
  const classNames={wizard:'BÜYÜCÜ',warrior:'SAVAŞÇI',strategist:'STRATEJİST',guardian:'GARDİYAN',chaos:'KAOS'};
  document.getElementById('d-art').textContent=card.emoji;
  document.getElementById('d-name').textContent=card.name;
  document.getElementById('d-class').textContent=classNames[card.class]||card.class;
  document.getElementById('d-atk').textContent=card.atk;
  document.getElementById('d-def').textContent=card.def;
  document.getElementById('d-cost').textContent=card.cost;
  document.getElementById('d-effect').textContent=card.effect;
  // find relevant combos
  const relCombos = COMBOS.filter(c=>c.desc.toLowerCase().includes(classNames[card.class]?.toLowerCase()||''));
  const combo = document.getElementById('d-combo');
  if(relCombos.length){
    combo.style.display='block';
    combo.textContent='⚡ '+relCombos.map(c=>c.name).join(', ');
  } else { combo.style.display='none'; }
  panel.classList.add('show');
  setTimeout(()=>panel.classList.remove('show'),4000);
}

// ═══════════════════════════════════════════════════════════
//  VISUAL FX
// ═══════════════════════════════════════════════════════════
function showFloatDmg(amount, color='#ff4444', isPlayer=false){
  const el = document.createElement('div');
  el.className='float-dmg';
  el.textContent=(isPlayer?'':'+')+amount;
  el.style.color=color;
  el.style.left=(30+Math.random()*40)+'%';
  el.style.top=(isPlayer?'70%':'30%');
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1300);
}

function showCombo(name,sub){
  const banner=document.getElementById('combo-banner');
  document.getElementById('combo-title').textContent=name;
  document.getElementById('combo-sub').textContent=sub;
  banner.classList.remove('show');
  void banner.offsetWidth;
  banner.classList.add('show');
  setTimeout(()=>banner.classList.remove('show'),2100);
}

// ═══════════════════════════════════════════════════════════
//  LOG
// ═══════════════════════════════════════════════════════════
function addLog(msg, type=''){
  const el=document.createElement('div');
  el.className='log-entry'+(type?' '+type:'');
  el.textContent=msg;
  const list=document.getElementById('log-list');
  list.prepend(el);
  while(list.children.length>30) list.lastChild.remove();
}

// ═══════════════════════════════════════════════════════════
//  PHASE BUTTONS (keyboard shortcuts)
// ═══════════════════════════════════════════════════════════
document.addEventListener('keydown',(e)=>{
  if(gs.gameOver) return;
  if(e.key==='b'||e.key==='B') goToBattle();
  if(e.key==='e'||e.key==='E') endTurn();
  if(e.key==='d'||e.key==='D') drawCard();
  if(e.key==='Escape'){ attackMode=false; selectedFieldIndex=-1; updateAll(); }
});

// Extra button
document.getElementById('controls').insertAdjacentHTML('afterbegin',
  `<button class="btn btn-gold" onclick="goToBattle()">SAVAŞ FAZI <span style="opacity:.5;font-size:.5rem">[B]</span></button>`
);

// ═══════════════════════════════════════════════════════════
//  START
// ═══════════════════════════════════════════════════════════
initGame();
</script>
</body>
